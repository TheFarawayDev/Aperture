  var path = kind === 'g' ? 'groups/' + id + '/keys/~admin' : 'dms/' + id + '/ak';
  keyCache[id] = rt('GET', path).then(function (w) { if (!w) throw new Error('nokey'); return unwrapWith(adminPriv, w); }).then(function (raw) { return rawToKey(raw, false); });
  keyCache[id].catch(function () { delete keyCache[id]; }); return keyCache[id];
}
function basePath(id, kind) { return (kind === 'g' ? 'groups/' : 'dms/') + id; }
function kindOf(id) { return id.indexOf('~') >= 0 ? 'd' : 'g'; }

/* REPORTS */
function loadStats() {
  Promise.all([rt('GET', 'reports', undefined, 'shallow=true'), rt('GET', 'nicknames', undefined, 'shallow=true'), rt('GET', 'bans', undefined, 'shallow=true'), rt('GET', 'dms', undefined, 'shallow=true'), rt('GET', 'groups', undefined, 'shallow=true')]).then(function (r) {
    var c = r.map(function (x) { return x ? Object.keys(x).length : 0; }), t = document.querySelector('.tabs [data-t="rep"]');
    t.innerHTML = 'Reports' + (c[0] ? '<span class="badge">' + c[0] + '</span>' : '');
    $('st').innerHTML = '<div class="stats"><div class="stat"><b>' + c[0] + '</b><span>Open reports</span></div><div class="stat"><b>' + c[1] + '</b><span>Users</span></div><div class="stat"><b>' + c[2] + '</b><span>Banned</span></div><div class="stat"><b>' + (c[3] + c[4]) + '</b><span>Chats</span></div></div>';
  }).catch(function () {});
}
function reports() {
  var v = $('view'); v.innerHTML = '<div class="hint">Loading…</div>'; loadStats();
  rt('GET', 'reports').then(function (r) {
    r = r || {}; var ks = Object.keys(r).sort().reverse();
    v.innerHTML = '<div class="row sp"><b>' + ks.length + ' open report' + (ks.length === 1 ? '' : 's') + '</b><button class="btn sm" id="rf" type="button">Refresh</button></div>' + (ks.length ? ks.map(function (k) { var x = r[k]; return '<div class="item"><div class="row sp"><span><span class="tag">REPORT</span> <b>' + esc(x.from) + '</b> <span class="meta">reported by ' + esc(x.by) + ' · ' + fmt(x.ts) + '</span></span></div><div class="txt">' + esc(x.t) + '</div><div class="meta">Chat: ' + esc(x.conv) + '</div><div class="row" style="margin-top:10px"><button class="btn sm" data-o="' + esc(x.conv) + '">Open chat</button><button class="btn sm danger" data-d="' + esc(k) + '">Delete message</button><button class="btn sm danger" data-b="' + esc(x.from) + '">Ban ' + esc(x.from) + '</button><button class="btn sm" data-x="' + esc(k) + '">Dismiss</button></div></div>'; }).join('') : '<div class="hint">Nothing to review.</div>');
    $('rf').onclick = reports;
    v.querySelectorAll('[data-o]').forEach(function (b) { b.onclick = function () { tab('chat'); openConv(b.dataset.o); }; });
    v.querySelectorAll('[data-x]').forEach(function (b) { b.onclick = function () { rt('DELETE', 'reports/' + b.dataset.x).then(reports).catch(fail('Could not dismiss')); }; });
    v.querySelectorAll('[data-b]').forEach(function (b) { b.onclick = function () { var n = b.dataset.b; ask({ title: 'Ban ' + n + '?', text: 'They are signed out and can no longer send messages. You can unban them in Users.', ok: 'Ban', danger: true, icon: 'fa-ban' }).then(function (ok) { if (!ok) return; ban(n, true).then(function () { toast(n + ' banned'); b.disabled = true; b.textContent = 'Banned'; }).catch(fail('Could not ban')); }); }; });
    v.querySelectorAll('[data-d]').forEach(function (b) { b.onclick = function () { var x = r[b.dataset.d]; ask({ title: 'Delete the reported message?', text: 'The message from ' + x.from + ' is removed for everyone in the chat.', ok: 'Delete message', danger: true, icon: 'fa-trash-can' }).then(function (ok) { if (!ok) return; rt('DELETE', basePath(x.conv, kindOf(x.conv)) + '/m/' + x.mk).then(function () { toast('Message deleted'); b.disabled = true; b.textContent = 'Deleted'; }).catch(fail('Could not delete it')); }); }; });
  }).catch(function () { v.innerHTML = '<div class="hint err">Could not load. Check the database rules and that your account is listed as an admin.</div>'; });
}
function ban(n, on) { return rt(on ? 'PUT' : 'DELETE', 'bans/' + n, on ? true : undefined); }

/* CHATS */
function chats() {
  var v = $('view'); v.innerHTML = '<div class="row"><input class="inp" id="cf" placeholder="Filter by nickname or group id" style="flex:1"><button class="btn sm" id="cr" type="button">Refresh</button></div><div id="cl" class="hint" style="margin-top:12px">Loading…</div><div id="cv"></div>';
  Promise.all([rt('GET', 'dms', undefined, 'shallow=true'), rt('GET', 'groups', undefined, 'shallow=true')]).then(function (r) {
    var all = Object.keys(r[0] || {}).map(function (k) { return { id: k, kind: 'd' }; }).concat(Object.keys(r[1] || {}).map(function (k) { return { id: k, kind: 'g' }; }));
    function draw() { var q = $('cf').value.trim().toLowerCase(); var l = all.filter(function (c) { return !q || c.id.toLowerCase().indexOf(q) >= 0; }).slice(0, 200); $('cl').innerHTML = l.length ? l.map(function (c) { return '<div class="item row sp" style="margin-top:6px"><span>' + (c.kind === 'd' ? '<i class="fa-solid fa-user"></i> ' : '<i class="fa-solid fa-user-group"></i> ') + esc(c.id) + '</span><button class="btn sm" data-c="' + esc(c.id) + '">Open</button></div>'; }).join('') : 'No chats found.'; $('cl').querySelectorAll('[data-c]').forEach(function (b) { b.onclick = function () { openConv(b.dataset.c); }; }); }
    $('cf').oninput = draw; $('cr').onclick = chats; draw();
  }).catch(function () { $('cl').textContent = 'Could not load chats.'; $('cl').className = 'hint err'; });
}
function openConv(id) {
  var kind = kindOf(id), v = $('view'); v.innerHTML = '<div class="row sp"><b>' + esc(id) + '</b><span class="row"><button class="btn sm danger" id="dc" type="button"><i class="fa-regular fa-trash-can"></i> Delete chat</button><button class="btn sm" id="bk" type="button">Back</button></span></div><div id="mm" class="hint">Loading…</div>';
  $('bk').onclick = function () { tab('chat'); };
  $('dc').onclick = function () { ask({ title: 'Delete this entire chat?', text: 'Every message, pin and key in ' + id + ' is removed for everyone. This cannot be undone.', ok: 'Delete chat', danger: true, icon: 'fa-trash-can' }).then(function (ok) { if (!ok) return; rt('DELETE', basePath(id, kind)).then(function () { toast('Chat deleted'); tab('chat'); }).catch(fail('Could not delete the chat')); }); };
  Promise.all([convKey(id, kind), rt('GET', basePath(id, kind) + '/m', undefined, 'orderBy=%22%24key%22&limitToLast=300')]).then(function (r) {
    var key = r[0], j = r[1] || {}, ks = Object.keys(j).sort();
    return Promise.all(ks.map(function (k) { return aesDec(key, j[k].i, j[k].t).catch(function () { return '(could not decrypt)'; }); })).then(function (txt) {
      $('mm').className = ''; $('mm').innerHTML = ks.length ? ks.map(function (k, n) { var m = j[k]; return '<div class="msg"><div class="h"><b>' + esc(m.f) + '</b>' + fmt(typeof m.ts === 'number' ? m.ts : keyTs(k)) + (m.ed ? ' · edited' : '') + '<button class="btn sm danger" data-k="' + esc(k) + '">Delete</button></div><p>' + esc(txt[n]) + '</p></div>'; }).join('') : '<div class="hint">No messages.</div>';
      $('mm').querySelectorAll('[data-k]').forEach(function (b) { b.onclick = function () { ask({ title: 'Delete this message?', text: 'It is removed for everyone in the chat.', ok: 'Delete', danger: true, icon: 'fa-trash-can' }).then(function (ok) { if (!ok) return; rt('DELETE', basePath(id, kind) + '/m/' + b.dataset.k).then(function () { b.closest('.msg').remove(); toast('Message deleted'); }).catch(fail('Could not delete it')); }); }; });
    });
  }).catch(function (e) { $('mm').className = 'hint err'; $('mm').textContent = e.message === 'nokey' ? 'No admin key is stored for this chat yet. It is added the next time a member opens it after the admin key exists.' : 'Could not read this chat.'; });
}

/* USERS */
function users() {
  var v = $('view'); v.innerHTML = '<div class="row"><input class="inp" id="uf" placeholder="Filter nicknames" style="flex:1"></div><div id="ul" class="hint" style="margin-top:12px">Loading…</div>';
  Promise.all([rt('GET', 'nicknames', undefined, 'shallow=true'), rt('GET', 'bans')]).then(function (r) {
    var names = Object.keys(r[0] || {}).sort(), bans = r[1] || {}, pics = {};
    function draw() {
      var q = $('uf').value.trim().toLowerCase(), l = names.filter(function (n) { return !q || n.indexOf(q) >= 0; }).slice(0, 100);
      $('ul').className = '';
      $('ul').innerHTML = l.length ? l.map(function (n) { var b = bans[n]; return '<div class="item row sp" style="margin-top:6px"><span class="row"><span class="av" data-n="' + esc(n) + '">' + esc(n.charAt(0).toUpperCase()) + '</span><b>' + esc(n) + '</b> ' + (b ? '<span class="tag">BANNED</span>' : '') + '</span><span class="row"><button class="btn sm" data-p="' + esc(n) + '" hidden>Clear picture</button><button class="btn sm ' + (b ? '' : 'danger') + '" data-b="' + esc(n) + '">' + (b ? 'Unban' : 'Ban') + '</button><button class="btn sm danger" data-x="' + esc(n) + '">Remove</button></span></div>'; }).join('') : '<div class="hint">No users.</div>';
      l.forEach(function (n) { if (pics[n] === undefined) rt('GET', 'nicknames/' + n + '/pic').then(function (p) { pics[n] = p || ''; paint(n); }).catch(function () { pics[n] = ''; }); else paint(n); });
      $('ul').querySelectorAll('[data-b]').forEach(function (b) { b.onclick = function () { var n = b.dataset.b, on = !bans[n]; ask({ title: (on ? 'Ban ' : 'Unban ') + n + '?', text: on ? 'They can no longer send messages or sign in to Messages.' : 'They can use Messages again.', ok: on ? 'Ban' : 'Unban', danger: on, icon: on ? 'fa-ban' : 'fa-user-check' }).then(function (ok) { if (!ok) return; ban(n, on).then(function () { if (on) bans[n] = true; else delete bans[n]; draw(); toast(on ? n + ' banned' : n + ' unbanned'); }).catch(fail('Failed')); }); }; });
      $('ul').querySelectorAll('[data-p]').forEach(function (b) { b.onclick = function () { var n = b.dataset.p; ask({ title: 'Clear ' + n + "'s picture?", text: 'Their profile picture is removed. They can set a new one.', ok: 'Clear picture', danger: true, icon: 'fa-image' }).then(function (ok) { if (!ok) return; rt('DELETE', 'nicknames/' + n + '/pic').then(function () { pics[n] = ''; draw(); toast('Picture cleared'); }).catch(fail('Could not clear it')); }); }; });
      $('ul').querySelectorAll('[data-x]').forEach(function (b) { b.onclick = function () { var n = b.dataset.x; ask({ title: 'Remove ' + n + '?', text: 'Their nickname, chat list and keys are deleted and the name becomes free. Their sign-in stays in Firebase Authentication; delete it there if needed.', ok: 'Remove user', danger: true, icon: 'fa-user-xmark' }).then(function (ok) { if (!ok) return; rt('GET', 'nicknames/' + n + '/u').then(function (u) { return Promise.all([rt('DELETE', 'users/' + u), rt('DELETE', 'keys/' + u)]); }).then(function () { return rt('DELETE', 'inbox/' + n); }).then(function () { return rt('DELETE', 'nicknames/' + n); }).then(function () { names.splice(names.indexOf(n), 1); draw(); toast(n + ' removed'); }).catch(fail('Could not remove the user')); }); }; });
    }
    function paint(n) { var el = $('ul').querySelector('.av[data-n="' + n + '"]'), pb = $('ul').querySelector('[data-p="' + n + '"]'); if (pb) pb.hidden = !pics[n]; if (el && pics[n]) { var im = new Image(); im.className = 'av'; im.referrerPolicy = 'no-referrer'; im.onload = function () { el.replaceWith(im); }; im.src = pics[n]; } }
    $('uf').oninput = draw; draw();
  }).catch(fail('Could not load users'));
}
})();
</script>
</body>
</html>
