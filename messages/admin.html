  var v = $('view'); v.innerHTML = '<div class="row"><input class="inp" id="uf" placeholder="Filter nicknames" style="flex:1"></div><div id="ul" class="hint" style="margin-top:12px">Loading…</div>';

    var names = Object.keys(r[0] || {}).sort(), bans = r[1] || {};
    function draw() { var q = $('uf').value.trim().toLowerCase(), l = names.filter(function (n) { return !q || n.indexOf(q) >= 0; }).slice(0, 300); $('ul').className = ''; $('ul').innerHTML = (l.length ? l.map(function (n) { var b = bans[n]; return '<div class="item row sp" style="margin-top:6px"><span><b>' + esc(n) + '</b> ' + (b ? '<span class="tag">BANNED</span>' : '') + '</span><span class="row"><button class="btn sm ' + (b ? '' : 'danger') + '" data-b="' + esc(n) + '">' + (b ? 'Unban' : 'Ban') + '</button><button class="btn sm danger" data-x="' + esc(n) + '">Remove</button></span></div>'; }).join('') : '<div class="hint">No users.</div>'); 
      $('ul').querySelectorAll('[data-b]').forEach(function (b) { b.onclick = function () { var n = b.dataset.b, on = !bans[n]; ban(n, on).then(function () { if (on) bans[n] = true; else delete bans[n]; draw(); }).catch(function () { toast('Failed'); }); }; });
      $('ul').querySelectorAll('[data-x]').forEach(function (b) { b.onclick = function () { var n = b.dataset.x; if (!confirm('Remove ' + n + ' from Messages? Their chat list and nickname are deleted. Their sign-in account stays in Firebase Authentication; delete it there if needed.')) return; rt('GET', 'nicknames/' + n + '/u').then(function (u) { return Promise.all([rt('DELETE', 'users/' + u).catch(function () {}), rt('DELETE', 'keys/' + u).catch(function () {})]); }).then(function () { return rt('DELETE', 'inbox/' + n); }).then(function () { return rt('DELETE', 'nicknames/' + n); }).then(function () { names.splice(names.indexOf(n), 1); draw(); toast('Removed'); }).catch(function () { toast('Failed'); }); }; });
    }
    $('uf').oninput = draw; draw();
  }).catch(function () { $('ul').textContent = 'Could not load users.'; $('ul').className = 'hint err'; });
}
})();
</script>
