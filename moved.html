<script>
/* ══════════════════════════════════════════════════════════════════
   APERTURE — FILE NAVIGATION
   Every link is built from file paths, relative to the site root:
     • going DOWN adds a part   →  utility/geography.html
     • going UP removes a part  →  ../index.html  (or index.html#utility)
   The root is found from where THIS file is loaded (assets/nav.js), so the
   site works from any folder, any host, or straight from disk (file://).

   Hooks a page can use (all optional):
     <a data-aperture-back>        Back button → goes up to the main page
     <span data-aperture-menu>     "Pages" dropdown listing every registered page
     <nav data-aperture-crumbs>    Breadcrumb: Aperture › Utility › This page
   ══════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  var cfg = window.APERTURE;
  var script = document.currentScript;
  if (!cfg || !script) return;

  var ROOT = new URL(document.documentElement.getAttribute('data-root') || './', location.href);                       // …/assets/nav.js → site root
  // Links are written without ".html" (cleaner URLs). Opening straight from disk (file://) still needs the extension.
  var NOEXT = location.protocol !== 'file:';
  var url = function (p) {
    var m = String(p).match(/^([^#?]*)(.*)$/), base = m[1], tail = m[2];
    if (base && !/\/$/.test(base) && !/\.[a-z0-9]+$/i.test(base) && !NOEXT) base += '.html';
    if (NOEXT) base = base.replace(/\/?index\.html$/, '/').replace(/\.html$/, '');
    return new URL(base + tail, ROOT).href;
  };
  var clean = function (p) { return p.replace(/index\.html$/, '').replace(/\.html$/, '').replace(/\/+$/, ''); };
  var target = '_self';
  try { if (window.top !== window.self) target = '_top'; } catch (e) { target = '_top'; }

  function groupOf(id) { return cfg.groups.filter(function (g) { return g.id === id; })[0]; }

  function current() {
    var here = clean(decodeURIComponent(location.pathname));
    for (var i = 0; i < cfg.pages.length; i++) {
      var p = clean(cfg.pages[i].path);
      if (here === p || here.slice(-(p.length + 1)) === '/' + p) return cfg.pages[i];
    }
    var leaf = here.split('/').pop();   // fallback: host rewrote the folder part
    for (var j = 0; j < cfg.pages.length; j++) { if (clean(cfg.pages[j].path).split('/').pop() === leaf) return cfg.pages[j]; }
    return null;
  }
  var page = current();

  // "up one part": from a page → its folder on the main page; from the main page → itself
  function upHref() {
    var pg = page && groupOf(page.group);
    if (page && pg && !pg.hidden) return url(cfg.home) + '#' + page.group;
    return url(cfg.home);
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* ── styles (self-contained so every page looks the same) ── */
  var css = '' +
  '.ap-btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#b4c0cf;font:500 13px Inter,system-ui,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}' +
  '.ap-btn:hover,.ap-btn[aria-expanded="true"]{background:#283340;color:#fff}' +
  '.ap-btn svg{width:14px;height:14px;opacity:.8}' +
  '.ap-menu{position:relative;display:inline-block}' +
  '.ap-pop{position:absolute;z-index:80;top:calc(100% + 12px);left:0;width:340px;max-width:calc(100vw - 24px);padding:8px;border-radius:18px;background:#212a34;border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 56px -20px rgba(2,5,9,.8),0 2px 6px rgba(2,5,9,.3);font-family:Inter,system-ui,sans-serif;animation:apIn .16s cubic-bezier(.2,.7,.2,1)}' +
  '.ap-pop[hidden]{display:none}' +
  '@keyframes apIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}' +
  '.ap-group{padding:10px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8795a8}' +
  '.ap-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;color:#b4c0cf;text-decoration:none}' +
  '.ap-item:hover,.ap-item:focus-visible{background:#30404f;color:#fff;outline:none}' +
  '.ap-item.is-here{background:rgba(91,143,232,.14)}' +
  '.ap-ico{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;background:#1a2129;color:#8fb3f5;font-size:13px}' +
  '.ap-item.is-here .ap-ico{background:#5b8fe8;color:#0e1620}' +
  '.ap-txt{min-width:0;flex:1}.ap-ttl{font-size:13.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}' +
  '.ap-path{font-size:11.5px;color:#8795a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}' +
  '.ap-here{font-size:11px;font-weight:600;color:#8fb3f5}' +
  '.ap-crumbs{display:flex;align-items:center;gap:2px;font:500 13px Inter,system-ui,sans-serif;color:#8795a8;min-width:0}' +
  '.ap-crumbs a{color:#b4c0cf;text-decoration:none;padding:5px 8px;border-radius:9px}.ap-crumbs a:hover{background:#283340;color:#fff}' +
  '.ap-crumbs b{color:#fff;font-weight:600;padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}' +
  '.ap-crumbs i{font-style:normal;opacity:.5}' +
  '@media (max-width:640px){.ap-pop{position:fixed;left:12px;right:12px;top:80px;width:auto}}' +
  /* ── shared mobile polish (all pages) ── */
  'html{-webkit-text-size-adjust:100%;text-size-adjust:100%}' +
  'a,button,select,summary,label,[role=button]{-webkit-tap-highlight-color:rgba(91,143,232,.18);touch-action:manipulation}' +
  'body{padding-bottom:env(safe-area-inset-bottom)}' +
  '@media (max-width:640px){html,body{max-width:100%;overflow-x:clip}input,select,textarea{font-size:max(16px,1em)}}' +
  '@media (pointer:coarse){' +
    '.ap-btn,.ap-item{min-height:44px}' +
    'a[data-lg]{display:inline-block;padding:11px 8px;margin:-6px -2px}' +
    'button:not(.ibtn),select,[role=button],summary,a.btn,a.pill{min-height:40px}' +
    'input:not([type=checkbox]):not([type=radio]):not([type=range]),textarea{min-height:42px}' +
    '.ap-crumbs a{padding:10px 8px}' +
  '}';
  /* ── liquid motion layer (shared by every page; mirrors the Messages design) ── */
  css += [
    ':root{--spring:cubic-bezier(.34,1.56,.64,1);--ease-out:cubic-bezier(.22,1,.36,1)}',
    '@view-transition{navigation:auto}',
    '::view-transition-old(root){animation:apVo .26s cubic-bezier(.5,0,.9,.4) both}',
    '::view-transition-new(root){animation:apVi .55s var(--ease-out) both}',
    '@keyframes apVo{to{opacity:0;transform:translateY(-10px) scale(.992);filter:blur(5px)}}',
    '@keyframes apVi{from{opacity:0;transform:translateY(16px) scale(.992);filter:blur(5px)}}',
    '@keyframes apRise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}',
    '@keyframes apPop{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}',
    '@keyframes apRip{to{transform:scale(1);opacity:0}}',
    '@keyframes apDlg{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}',
    '@keyframes apDlgx{to{opacity:0;transform:translateY(10px) scale(.96)}}',
    '@keyframes apBd{from{opacity:0}to{opacity:1}}',
    '@keyframes apDrift1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(9vw,7vh) scale(1.18)}66%{transform:translate(-6vw,12vh) scale(.92)}}',
    '@keyframes apDrift2{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(-10vw,-8vh) scale(1.12)}70%{transform:translate(5vw,-14vh) scale(.9)}}',
    '@keyframes apDrift3{0%,100%{transform:translate(0,0) scale(.9)}50%{transform:translate(8vw,-10vh) scale(1.2)}}',
    /* drifting colour behind everything */
    '.ap-liquid{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;mix-blend-mode:screen}',
    '.ap-liquid i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.2;will-change:transform}',
    '.ap-liquid i:nth-child(1){width:46vmax;height:46vmax;left:-14vmax;top:-18vmax;background:#5b8fe8;animation:apDrift1 26s ease-in-out infinite}',
    '.ap-liquid i:nth-child(2){width:38vmax;height:38vmax;right:-12vmax;bottom:-14vmax;background:#7b61ff;opacity:.16;animation:apDrift2 32s ease-in-out infinite}',
    '.ap-liquid i:nth-child(3){width:26vmax;height:26vmax;left:38%;top:42%;background:#37c8b4;opacity:.09;animation:apDrift3 38s ease-in-out infinite}',
    '@media(max-width:640px){.ap-liquid i{filter:blur(48px)}}',
    /* page + list entrances */
    'main>*,.wrap>*{animation:apRise .75s var(--ease-out) backwards}',
    'main>*:nth-child(2),.wrap>*:nth-child(2){animation-delay:.07s}main>*:nth-child(3),.wrap>*:nth-child(3){animation-delay:.14s}main>*:nth-child(4),.wrap>*:nth-child(4){animation-delay:.21s}main>*:nth-child(n+5),.wrap>*:nth-child(n+5){animation-delay:.28s}',
    '.gc,.tool,.dir-row,.prow,.tool-card{animation:apPop .55s var(--spring) backwards}',
    '.gc:nth-child(2),.tool:nth-child(2),.dir-row:nth-child(2),.prow:nth-child(2){animation-delay:.04s}.gc:nth-child(3),.tool:nth-child(3),.dir-row:nth-child(3),.prow:nth-child(3){animation-delay:.08s}.gc:nth-child(4),.tool:nth-child(4),.dir-row:nth-child(4),.prow:nth-child(4){animation-delay:.12s}.gc:nth-child(n+5),.tool:nth-child(n+5),.dir-row:nth-child(n+5),.prow:nth-child(n+5){animation-delay:.16s}',
    /* springy controls */
    '.btn,.ibtn,.pill,.ap-btn,.home,.chip,.tabs button,.filter-tab,.link-btn,.st,.chips button,.gc,.tool,.dir-row,.prow{transition:transform .35s var(--spring),background-color .25s var(--ease-out),border-color .25s,color .2s,box-shadow .3s var(--ease-out),opacity .2s}',
    '.btn,.pill,.ap-btn{position:relative;overflow:hidden}',
    '.ap-rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.32);transform:scale(0);animation:apRip .6s var(--ease-out) forwards;pointer-events:none}',
    '@media(hover:hover){.btn:not(:disabled):hover,.pill:hover,.ap-btn:hover,.home:hover{transform:translateY(-1px)}.gc:hover,.tool:hover,.prow:hover{transform:translateY(-3px);box-shadow:0 14px 30px -16px rgba(2,5,9,.85)}.dir-row:hover{transform:translateX(3px)}.btn.pri:not(:disabled):hover,.pill.is-primary:hover{box-shadow:0 8px 22px -8px rgba(91,143,232,.7)}}',
    '.btn:not(:disabled):active,.ibtn:active,.pill:active,.ap-btn:active,.home:active,.chip:active,.filter-tab:active,.st:active{transform:scale(.94);transition-duration:.12s}.gc:active,.tool:active,.dir-row:active,.prow:active{transform:scale(.98);transition-duration:.12s}',
    '.inp:focus,input:focus,select:focus,textarea:focus{transition:border-color .2s,box-shadow .35s var(--ease-out)}',
    /* dialogs & toasts */
    'dialog[open]{animation:apDlg .42s var(--spring)}dialog[open]::backdrop{animation:apBd .3s ease-out}dialog.ap-closing{animation:apDlgx .2s ease-in forwards}',
    '.ap-pop{animation:apDlg .4s var(--spring)}',
    '@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.ap-liquid{display:none}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}'
  ].join('');

  var reduce = function () { return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; };
  var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
  /* ── liquid motion: background blobs, ripple, animated dialog close ── */
  if (!document.querySelector('.ap-liquid') && !document.documentElement.hasAttribute('data-no-liquid')) {
    var lq = document.createElement('div'); lq.className = 'ap-liquid'; lq.setAttribute('aria-hidden', 'true'); lq.innerHTML = '<i></i><i></i><i></i>';
    (document.body || document.documentElement).insertBefore(lq, (document.body || document.documentElement).firstChild);
  }
  document.addEventListener('pointerdown', function (e) {
    var b = e.target.closest && e.target.closest('.btn,.pill,.ap-btn'); if (!b || b.disabled || reduce()) return;
    if (b.classList.contains('rip-off')) return;
    var r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2, i = document.createElement('i');
    i.className = 'ap-rip'; i.style.cssText = 'width:' + d + 'px;height:' + d + 'px;left:' + (e.clientX - r.left - d / 2) + 'px;top:' + (e.clientY - r.top - d / 2) + 'px';
    b.appendChild(i); setTimeout(function () { i.remove(); }, 650);
  }, { passive: true });
  if (window.HTMLDialogElement && !HTMLDialogElement.prototype.__apLiquid) {
    var oc = HTMLDialogElement.prototype.close; HTMLDialogElement.prototype.__apLiquid = 1;
    HTMLDialogElement.prototype.close = function (v) {
      var d = this; if (!d.open || d.classList.contains('closing') || d.classList.contains('ap-closing') || reduce()) return oc.call(d, v);
      d.classList.add('ap-closing'); setTimeout(function () { d.classList.remove('ap-closing'); oc.call(d, v); }, 190);
    };
  }


  /* ── Back (up one part) ── */
  document.querySelectorAll('[data-aperture-back]').forEach(function (a) {
    a.setAttribute('href', upHref()); a.setAttribute('target', target);
  });

  /* ── Breadcrumbs: Aperture › Utility › Page  (each crumb is a path you can trim back to) ── */
  document.querySelectorAll('[data-aperture-crumbs]').forEach(function (el) {
    var h = '<a href="' + url(cfg.home) + '" target="' + target + '">' + esc(cfg.name) + '</a>';
    if (page) {
      var g = groupOf(page.group);
      h += '<i>›</i><a href="' + url(cfg.home) + '#' + page.group + '" target="' + target + '">' + esc(g ? g.title : page.group) + '</a>';
      h += '<i>›</i><b>' + esc(page.title) + '</b>';
    }
    el.className = (el.className ? el.className + ' ' : '') + 'ap-crumbs';
    el.innerHTML = h;
  });

  /* ── Pages dropdown ── */
  document.querySelectorAll('[data-aperture-menu]').forEach(function (mount) {
    var grid = '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="1.5" y="1.5" width="5.2" height="5.2" rx="1.4"/><rect x="9.3" y="1.5" width="5.2" height="5.2" rx="1.4"/><rect x="1.5" y="9.3" width="5.2" height="5.2" rx="1.4"/><rect x="9.3" y="9.3" width="5.2" height="5.2" rx="1.4"/></svg>';
    var body = '<a class="ap-item' + (page ? '' : ' is-here') + '" href="' + url(cfg.home) + '" target="' + target + '"><span class="ap-ico"><i class="fa-solid fa-house"></i></span><span class="ap-txt"><div class="ap-ttl">' + esc(cfg.name) + ' home</div><div class="ap-path">' + esc(cfg.home) + '</div></span></a>';
    cfg.groups.forEach(function (g) {
      if (g.hidden && !(page && page.group === g.id)) return;
      body += '<div class="ap-group">' + esc(g.title) + '</div>';
      cfg.pages.filter(function (p) { return p.group === g.id; }).forEach(function (p) {
        var here = page && page.id === p.id;
        body += '<a class="ap-item' + (here ? ' is-here' : '') + '" href="' + url(p.path) + '" target="' + target + '"' + (here ? ' aria-current="page"' : '') + '>' +
          '<span class="ap-ico"><i class="fa-solid ' + esc(p.icon) + '"></i></span>' +
          '<span class="ap-txt"><div class="ap-ttl">' + esc(p.title) + '</div><div class="ap-path">' + esc(p.path) + '</div></span>' +
          (here ? '<span class="ap-here">Here</span>' : '') + '</a>';
      });
    });
    mount.className = (mount.className ? mount.className + ' ' : '') + 'ap-menu';
    mount.innerHTML = '<button type="button" class="ap-btn" aria-haspopup="true" aria-expanded="false">' + grid + '<span>Pages</span></button><div class="ap-pop" hidden>' + body + '</div>';
    var btn = mount.querySelector('button'), pop = mount.querySelector('.ap-pop');
    function set(open) { pop.hidden = !open; btn.setAttribute('aria-expanded', open ? 'true' : 'false'); if (open) { var f = pop.querySelector('.is-here') || pop.querySelector('a'); f && f.focus({ preventScroll: true }); } }
    btn.addEventListener('click', function () { set(pop.hidden); });
    document.addEventListener('click', function (e) { if (!mount.contains(e.target)) set(false); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !pop.hidden) { set(false); btn.focus(); }
      if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !pop.hidden) {
        e.preventDefault();
        var items = [].slice.call(pop.querySelectorAll('a')), i = items.indexOf(document.activeElement);
        items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
      }
    });
  });

  /* ── legal links: fix hrefs, and add them to the footer of every page ── */
  var LEGAL = [['legal/privacy-policy', 'Privacy'], ['legal/terms-of-use', 'Terms'], ['legal/school-and-district', 'Schools & districts']];
  function legalLinks() {
    document.querySelectorAll('a[data-lg]').forEach(function (a) { a.setAttribute('href', url(a.getAttribute('href').replace(/^(\.\.\/)+/, ''))); });
    var f = document.querySelector('footer');
    if (!f || f.querySelector('[data-lg]') || document.documentElement.hasAttribute('data-no-legal')) return;
    var d = document.createElement('div');
    d.className = 'no-print';
    d.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center;margin-top:10px;font-size:12px';
    d.innerHTML = LEGAL.map(function (l) { return '<a data-lg href="' + url(l[0]) + '" target="' + target + '" style="color:#8fb3f5;text-decoration:none">' + esc(l[1]) + '</a>'; }).join('');
    (f.firstElementChild || f).appendChild(d);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', legalLinks); else legalLinks();

  /* ── public helpers (used by the main page) ── */
  window.Aperture = { config: cfg, root: ROOT.href, url: url, current: page, target: target, up: upHref };
})();

/* ── Basic inspect deterrent (keyboard shortcuts + context menu) ── */
(function () {
  var block = function (e) { e.preventDefault(); e.stopPropagation(); return false; };
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toLowerCase(), c = e.ctrlKey || e.metaKey;
    if (e.keyCode === 123 || k === 'f12' ||
        (c && e.shiftKey && 'ijcknm'.indexOf(k) > -1 && k.length === 1) ||
        (e.metaKey && e.altKey && 'iujc'.indexOf(k) > -1 && k.length === 1) ||
        (c && !e.shiftKey && (k === 'u' || k === 's'))) return block(e);
  }, true);
  document.addEventListener('contextmenu', function (e) {
    var t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA') return;
    return block(e);
  }, true);
})();

</script>
<script>
/* Inside a frame (e.g. Google Sites) open in a new tab; as a normal page just navigate. */
(function () {
  var a = document.getElementById('go'), framed = false;
  try { framed = window.top !== window.self; } catch (e) { framed = true; }
  if (window.Aperture) a.href = Aperture.url(window.APERTURE.home);
  if (!framed) { a.target = '_self'; document.querySelector('.sub').style.display = 'none'; }
})();
</script>
